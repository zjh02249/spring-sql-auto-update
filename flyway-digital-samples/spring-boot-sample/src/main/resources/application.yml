# Application Configuration
spring:
  application:
    name: flyway-digital-spring-boot-sample
  
  # H2 Database (for demo)
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Console (for development)
  h2:
    console:
      enabled: true
      path: /h2-console

# Flyway Digital Configuration
flyway-digital:
  enabled: true
  locations: classpath:db/migration
  table: flyway_digital_history
  baseline-on-migrate: false
  validate-on-migrate: true
  out-of-order: false

# Logging
logging:
  level:
    com.flywaydigital: DEBUG
    org.springframework.jdbc: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
